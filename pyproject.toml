[project]
name = "erms"
version = "0.1.0"
description = "Electronic Records Management System"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "rfc8785>=0.1.4,<1",
    "jsonschema>=4.23,<5",
    "python-docx>=1.1,<2",
    "pypdf>=6,<7",
    "Babel>=2.17,<3",
    "cryptography>=50,<51",
    "psycopg[binary,pool]>=3.2,<4",
    "python-dotenv>=1.0,<2",
    "python-multipart>=0.0.20,<1",
    "uvicorn[standard]>=0.34,<1",
    "psutil>=7,<8",
]

[project.optional-dependencies]
test = [
    "httpx>=0.28,<1",
    "pytest>=8,<9",
]

[tool.pytest.ini_options]
testpaths = ["backend/services/api/tests"]
addopts = "-ra"
