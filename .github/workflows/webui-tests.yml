name: WebUI regression tests
on: workflow_dispatch
permissions:
  contents: read
jobs:
  db-free:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            backend/services/api/requirements.txt
            frontend/webui/requirements.txt
            frontend/webui/requirements-test.txt
      - name: Install test dependencies
        run: python -m pip install -r backend/services/api/requirements.txt -r frontend/webui/requirements-test.txt
      - name: Run isolated suites twice
        run: python tools/run_webui_tests.py --python python --repeat 2 --output .runtime/webui-ci
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: webui-test-results
          path: |
            .runtime/webui-ci/*.log
            .runtime/webui-ci/*.xml
            .runtime/webui-ci/summary.json
  assembled:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        # The canonical schema requires PostgreSQL 18 for Arabic text search.
        image: postgres:18
        env:
          POSTGRES_PASSWORD: disposable-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # Only this ephemeral service is used; the runner creates a second,
      # uniquely named database and drops it on success or failure.
      DATABASE_URL: postgresql://postgres:disposable-ci-only@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: python -m pip install -r backend/services/api/requirements.txt -r frontend/webui/requirements-test.txt
      - name: Verify runner isolation and failure handling
        run: python -m pytest tools/tests/test_webui_test_runner.py tools/tests/test_webui_integration_runner.py tools/tests/test_webui_browser_server.py -q
      - name: Exercise assembled application with real API
        run: python tools/run_webui_integration.py --webui-python python --output .runtime/webui-assembled-ci
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: webui-assembled-results
          path: |
            .runtime/webui-assembled-ci/*.log
            .runtime/webui-assembled-ci/*.xml
            .runtime/webui-assembled-ci/*.json
            .runtime/webui-assembled-ci/*.jsonl
